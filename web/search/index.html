<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Employees · Kamana</title><link rel="stylesheet" href="/static/style.css"></head><body>
<!--header-->
<main>
      <form class="search-box" method="get" action="/search">
        <label>State<select data-state name="state" required data-placeholder="Choose a state"><option value="">Choose a state</option></select></label>
        <label>City / शहर (optional / वैकल्पिक)<select data-city name="city" data-placeholder="Any city / कोई भी शहर" data-placeholder-ready="Any city / कोई भी शहर"><option value="">Any city / कोई भी शहर</option></select></label>
        <input type="hidden" name="location_mode" data-location-mode value="city">
        <label class="conditional" data-city-other-wrap>Enter city<input name="city_other" value="" placeholder="Type a city"></label>
        <label class="conditional" data-pincode-wrap>PIN code<input name="pincode" value="" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit PIN code"></label>
        <div class="search-profession-row">
          <div class="profession-field">
            <label>Trade / Job Profile<input data-profession-search name="q" value="" type="text" maxlength="120" autocomplete="off" aria-autocomplete="list" aria-controls="profession-suggestions" aria-expanded="false" aria-describedby="search-help" placeholder="e.g. Electrician, Tailor / जैसे बिजली मिस्त्री, दर्जी"></label>
            <div class="profession-suggestions" id="profession-suggestions" role="listbox" aria-label="Suggestions" hidden></div>
          </div>
          <button class="button" type="submit">Search employees <span>⌕</span></button>
          <p class="search-help" id="search-help">Choose a suggestion or type any job name; we’ll show close matches. Leave blank to search the whole state. / सुझाव चुनें या काम का नाम लिखें; मिलते-जुलते प्रोफ़ाइल दिखेंगे।</p>
        </div></form>
      </main><!--footer--><script type="module" src="/src/pages/search.ts"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Employees · Kamana</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><a class="brand" href="/" aria-label="Kamana home"><span class="mark">K</span></a><nav><a href="/search">Find Employees</a><a href="/post">Apply for Job</a></nav></header>

        <label class="conditional" data-job-other-wrap>Enter job profile<input name="job_other" value="" placeholder="Type a job"></label>

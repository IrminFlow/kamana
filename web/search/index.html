<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Employees · Kamana</title><link rel="stylesheet" href="/static/style.css"></head><body>
<!--header-->
<main>
      <form class="search-box" method="get" action="/search">
        <label>State<select data-state name="state" required><option value=""></option></select></label>
        <label>City / शहर (optional / वैकल्पिक)<select data-city name="city"><option value="">जहाँ काम करना चाहते हो</option></select></label>
        <input type="hidden" name="location_mode" data-location-mode value="">
        <label class="conditional" data-city-other-wrap>Enter city<input name="city_other" value="" placeholder="Type a city"></label>
        <label class="conditional" data-pincode-wrap>PIN code<input name="pincode" value="" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit PIN code"></label>
        <div class="search-profession-row"><label class="profession-search">Trade / Job Profile<input data-profession-search name="q" aria-describedby="search-help" value="" type="text" autocomplete="off" aria-autocomplete="list" aria-controls="profession-suggestions" aria-expanded="false" placeholder="नौकरी या पेशा"></label><p class="search-help" id="search-help">Choose a suggestion or type any job name; we’ll show close matches. Leave blank to search the whole state. / सुझाव चुनें या काम का नाम लिखें; मिलते-जुलते प्रोफ़ाइल दिखेंगे।</p><div class="profession-suggestions" id="profession-suggestions" role="listbox" hidden></div>
          <button class="button" type="submit">Search employees <span>⌕</span></button>
        </div></form>
      </main><!--footer--><script type="module" src="/src/pages/search.ts"></script></body></html>
